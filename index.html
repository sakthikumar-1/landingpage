<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakthi Kumar | Coming Soon</title>
    <meta
      name="description"
      content="A new chapter. A clearer vision. A bigger ambition. Welcome to the official personal identity website of Sakthi Kumar."
    />
    <meta name="theme-color" content="#050505" />
    <meta name="author" content="Sakthi Kumar" />
    <link rel="canonical" href="https://sakthikumar.com/" />

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sakthi-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sakthikumar.com/" />
    <meta property="og:title" content="Sakthi Kumar | Coming Soon" />
    <meta
      property="og:description"
      content="A new chapter. A clearer vision. A bigger ambition. Welcome to the official website of Sakthi Kumar."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sakthi Kumar | Coming Soon" />
    <meta
      name="twitter:description"
      content="A new chapter. A clearer vision. A bigger ambition. Welcome to the official website of Sakthi Kumar."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
